[package]
name = "rpios"
version = "0.0.1"
authors = ["dearfl <i@flr.me>"]
edition = "2024"

[profile.release]
lto = true

[features]
default = [ "bsp_rpi4" ]
bsp_rpi3 = [ "tock-registers" ]
bsp_rpi4 = [ "tock-registers" ]

[[bin]]
name = "kernel"
path = "src/main.rs"

[dependencies]
tock-registers = { version = "0.10.1", default-features = false, features = [ "register_types" ], optional = true }

# [target.aarch64-unknown-none-softfloat.dependencies]
[target.'cfg(target_arch = "aarch64")'.dependencies]
aarch64-cpu = "11.2.0"
